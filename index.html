<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Centre de Comandament Espacial</title>
    <meta http-equiv="refresh" content="300">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&family=Inter:wght@300;400;600&display=swap');

        :root {
            --bg-dark: #030508;
            --panel-bg: rgba(10, 15, 26, 0.85);
            --panel-border: rgba(0, 240, 255, 0.25);
            --neon-blue: #00f0ff;
            --neon-green: #00ff66;
            --neon-amber: #ffb700;
            --text-main: #e0f2fe;
            --text-dim: #7dd3fc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(10, 30, 60, 0.4) 0%, rgba(3, 5, 8, 0.95) 100%),
                linear-gradient(rgba(0, 240, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 240, 255, 0.03) 1px, transparent 1px);
            background-size: 100% 100%, 20px 20px, 20px 20px;
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            padding: 6px;
            padding-top: env(safe-area-inset-top, 6px);
            padding-bottom: env(safe-area-inset-bottom, 6px);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .dashboard-container {
            display: flex;
            flex-direction: column;
            gap: 6px;
            width: 100%;
            flex-grow: 1;
            justify-content: space-evenly;
        }

        .space-screens {
            display: grid;
            grid-template-columns: 1fr;
            gap: 6px;
        }

        .telemetry-panels {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
        }

        .screen-card, .telemetry-card {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 8px;
            padding: 6px 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            position: relative;
            backdrop-filter: blur(8px);
            box-shadow: inset 0 0 10px rgba(0, 240, 255, 0.03);
            overflow: hidden;
            text-align: center;
        }

        .screen-card {
            height: 165px;
        }

        .telemetry-card {
            height: 82px;
        }

        .screen-card::before, .telemetry-card::before {
            content: '';
            position: absolute;
            top: 3px; left: 3px;
            width: 5px; height: 5px;
            border-top: 1.5px solid var(--neon-blue);
            border-left: 1.5px solid var(--neon-blue);
        }

        .screen-card::after, .telemetry-card::after {
            content: '';
            position: absolute;
            bottom: 3px; right: 3px;
            width: 5px; height: 5px;
            border-bottom: 1.5px solid var(--neon-blue);
            border-right: 1.5px solid var(--neon-blue);
        }

        .card-header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(0, 240, 255, 0.15);
            padding-bottom: 3px;
            margin-bottom: 2px;
            flex-shrink: 0;
        }

        .card-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.6rem;
            font-weight: 700;
            color: var(--neon-blue);
            letter-spacing: 0.5px;
            text-align: left;
        }

        .card-coords {
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.55rem;
            color: var(--text-dim);
            text-align: right;
        }

        .canvas-container {
            width: 100%;
            flex-grow: 1;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 0;
        }

        canvas {
            max-width: 100%;
            max-height: 100%;
        }

        .badge-info {
            background: rgba(0, 240, 255, 0.1);
            border: 1px solid var(--neon-blue);
            padding: 2px 6px;
            border-radius: 8px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.55rem;
            color: #fff;
            text-align: center;
            letter-spacing: 0.5px;
            box-shadow: 0 0 6px rgba(0, 240, 255, 0.2);
            flex-shrink: 0;
            margin-top: 2px;
        }

        .gauge-label {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.5rem;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            width: 100%;
            text-align: center;
        }

        .gauge-value-container {
            display: flex;
            align-items: baseline;
            justify-content: center;
            gap: 2px;
            margin: auto 0;
            width: 100%;
        }

        .gauge-value {
            font-family: 'Share Tech Mono', monospace;
            font-size: 1.25rem;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 0 8px var(--neon-blue);
            line-height: 1;
        }

        .gauge-unit {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.65rem;
            color: var(--neon-blue);
        }

        .meter-bar {
            width: 100%;
            height: 3px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            overflow: hidden;
            margin: 2px 0;
        }

        .meter-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--neon-blue), var(--neon-green));
            width: 50%;
            transition: width 0.5s ease-in-out;
            box-shadow: 0 0 4px var(--neon-blue);
        }

        .sub-status-text {
            font-size: 0.5rem;
            color: var(--text-dim);
            font-family: 'Share Tech Mono', monospace;
            text-align: center;
            width: 100%;
        }

        footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.5rem;
            color: var(--text-dim);
            padding: 2px 4px 0 4px;
            flex-shrink: 0;
        }

        /* --- ORIENTACIÓ HORITZONTAL (LANDSCAPE EN MÒBIL) --- */
        @media (orientation: landscape) and (max-height: 500px) {
            .dashboard-container {
                display: grid;
                grid-template-columns: 1.2fr 1fr;
                height: calc(100vh - 20px);
                gap: 6px;
            }

            .space-screens {
                grid-template-columns: 1fr 1fr;
                height: 100%;
            }

            .telemetry-panels {
                grid-template-columns: 1fr 1fr;
                grid-template-rows: 1fr 1fr;
                height: 100%;
            }

            .screen-card, .telemetry-card {
                height: 100%;
            }

            .gauge-value {
                font-size: 1.1rem;
            }
        }

        /* DESKTOP */
        @media (min-width: 850px) {
            body {
                padding: 12px;
            }
            .dashboard-container {
                height: calc(100vh - 30px);
            }
            .space-screens {
                grid-template-columns: 1fr 1fr;
                flex: 1.6;
            }
            .telemetry-panels {
                grid-template-columns: repeat(4, 1fr);
                flex: 1;
            }
            .screen-card, .telemetry-card {
                height: 100%;
            }
            .gauge-value {
                font-size: 2rem;
            }
        }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div class="dashboard-container">
        
        <div class="space-screens">
            
            <!-- Target 1: PLANETA TERRA -->
            <div class="screen-card">
                <div class="card-header">
                    <span class="card-title">PLANETA TERRA</span>
                    <span class="card-coords">41.38° N, 2.16° E</span>
                </div>
                <div class="canvas-container" id="earth-canvas-container"></div>
                <div class="badge-info" id="earth-status">FOSCOR / CLAROR</div>
            </div>

            <!-- Target 2: LLUNA -->
            <div class="screen-card">
                <div class="card-header">
                    <span class="card-title">LLUNA</span>
                    <span class="card-coords" id="moon-percent-text">77.0%</span>
                </div>
                <div class="canvas-container" id="moon-canvas-container"></div>
                <div class="badge-info" id="moon-phase-name">GIBOSA CREIXENT</div>
            </div>

        </div>

        <div class="telemetry-panels">
            
            <!-- Target 3: HORA LOCAL -->
            <div class="telemetry-card">
                <div class="gauge-label">HORA LOCAL</div>
                <div class="gauge-value-container">
                    <span class="gauge-value" id="time-val">--:--:--</span>
                </div>
                <div class="meter-bar">
                    <div class="meter-fill" id="time-meter" style="width: 0%;"></div>
                </div>
                <div class="sub-status-text" id="date-val">-- --- ----</div>
            </div>

            <div class="telemetry-card">
                <div class="gauge-label">TEMP. LOCAL</div>
                <div class="gauge-value-container">
                    <span class="gauge-value" id="temp-val">27.2</span>
                    <span class="gauge-unit">°C</span>
                </div>
                <div class="meter-bar">
                    <div class="meter-fill" id="temp-meter" style="width: 65%;"></div>
                </div>
                <div class="sub-status-text" id="temp-status">SENSÒRICA TÈRMICA</div>
            </div>

            <div class="telemetry-card">
                <div class="gauge-label">ALTITUD</div>
                <div class="gauge-value-container">
                    <span class="gauge-value" id="alt-val">14</span>
                    <span class="gauge-unit">m</span>
                </div>
                <div class="meter-bar">
                    <div class="meter-fill" id="alt-meter" style="width: 14%; background: linear-gradient(90deg, var(--neon-blue), var(--neon-amber));"></div>
                </div>
                <div class="sub-status-text" id="alt-status">NIVELL DEL MAR</div>
            </div>

            <div class="telemetry-card">
                <div class="gauge-label">HUMITAT</div>
                <div class="gauge-value-container">
                    <span class="gauge-value" id="hum-val">62</span>
                    <span class="gauge-unit">%</span>
                </div>
                <div class="meter-bar">
                    <div class="meter-fill" id="hum-meter" style="width: 62%;"></div>
                </div>
                <div class="sub-status-text">HIGRÒMETRE</div>
            </div>

        </div>

    </div>

    <footer>
        <span>BARCELONA ORBITAL © 2026</span>
        <span id="location-name">LAT: 41.38° N | LON: 2.16° E</span>
    </footer>

    <script>
        const daysCa = ['DIU', 'DILL', 'DIM', 'DIMC', 'DIJ', 'DIV', 'DISS'];
        const monthsCa = ['JAN', 'FEB', 'MAR', 'ABR', 'MAIG', 'JUN', 'JUL', 'AGO', 'SET', 'OCT', 'NOV', 'DES'];

        function updateClock() {
            const now = new Date();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            const s = String(now.getSeconds()).padStart(2, '0');
            
            document.getElementById('time-val').innerText = `${h}:${m}:${s}`;
            
            const dayName = daysCa[now.getDay()];
            const dayNum = String(now.getDate()).padStart(2, '0');
            const monthName = monthsCa[now.getMonth()];
            
            document.getElementById('date-val').innerText = `${dayName} ${dayNum} ${monthName}`;

            const secondsProgress = (now.getSeconds() / 60) * 100;
            document.getElementById('time-meter').style.width = `${secondsProgress}%`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        function updateLocationData() {
            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition(async (position) => {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    const alt = position.coords.altitude;

                    document.getElementById('location-name').innerText = `LAT: ${lat.toFixed(2)}° N | LON: ${lon.toFixed(2)}° E`;

                    if (alt !== null) {
                        document.getElementById('alt-val').innerText = Math.round(alt);
                        document.getElementById('alt-status').innerText = "SENSOR GPS";
                        document.getElementById('alt-meter').style.width = `${Math.min(alt / 5, 100)}%`;
                    }

                    try {
                        const response = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true&hourly=relativehumidity_2m`);
                        const data = await response.json();
                        
                        if (data.current_weather) {
                            const temp = data.current_weather.temperature;
                            document.getElementById('temp-val').innerText = temp.toFixed(1);
                            document.getElementById('temp-meter').style.width = `${Math.min(Math.max((temp + 10) * 2, 0), 100)}%`;
                        }

                        if (data.hourly && data.hourly.relativehumidity_2m) {
                            const hum = data.hourly.relativehumidity_2m[0];
                            document.getElementById('hum-val').innerText = hum;
                            document.getElementById('hum-meter').style.width = `${hum}%`;
                        }
                    } catch (e) {
                        console.log("Error carregant dades meteo.");
                    }
                });
            }
        }

        updateLocationData();
        setInterval(updateLocationData, 300000);

        /* THREE.JS PLANET RENDERERS */
        const textureLoader = new THREE.TextureLoader();
        const earthMapUrl = 'https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/textures/planets/earth_atmos_2048.jpg';
        const earthSpecularUrl = 'https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/textures/planets/earth_specular_2048.jpg';
        const earthNormalUrl = 'https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/textures/planets/earth_normal_2048.jpg';
        const moonMapUrl = 'https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/textures/planets/moon_1024.jpg';

        /* EARTH RENDER */
        const earthContainer = document.getElementById('earth-canvas-container');
        const earthScene = new THREE.Scene();
        const earthCamera = new THREE.PerspectiveCamera(45, earthContainer.clientWidth / earthContainer.clientHeight, 0.1, 1000);
        const earthRenderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        
        earthRenderer.setSize(earthContainer.clientWidth, earthContainer.clientHeight);
        earthRenderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        earthContainer.appendChild(earthRenderer.domElement);

        const earthGeometry = new THREE.SphereGeometry(2, 64, 64);
        const earthMaterial = new THREE.MeshPhongMaterial({
            map: textureLoader.load(earthMapUrl),
            specularMap: textureLoader.load(earthSpecularUrl),
            normalMap: textureLoader.load(earthNormalUrl),
            specular: new THREE.Color(0x333333),
            shininess: 15
        });

        const earthMesh = new THREE.Mesh(earthGeometry, earthMaterial);
        earthScene.add(earthMesh);

        // Centrem la vista sobre Barcelona (Lat 41.38° N, Lon 2.16° E)
        const latBCN = 41.3879 * (Math.PI / 180);
        const lonBCN = 2.1699 * (Math.PI / 180);
        earthMesh.rotation.y = -lonBCN - Math.PI / 2;
        earthMesh.rotation.x = latBCN;

        earthCamera.position.z = 5.0;

        const earthSunLight = new THREE.DirectionalLight(0xffffff, 1.5);
        earthScene.add(earthSunLight);
        const earthAmbient = new THREE.AmbientLight(0x0a1020, 0.15);
        earthScene.add(earthAmbient);

        /* CÀLCUL SOLAR PRECÍS EN HORA UTC I LONGITUD */
        function updateEarthSolarLighting() {
            const now = new Date();
            const utcHours = now.getUTCHours() + now.getUTCMinutes() / 60 + now.getUTCSeconds() / 3600;
            
            // Angle solar segons l'hora UTC actual (12:00 UTC = Sol al meridià 0)
            const sunAngleUTC = ((utcHours - 12) / 24) * Math.PI * 2;
            
            const sunDistance = 15;
            earthSunLight.position.set(
                Math.sin(sunAngleUTC - lonBCN) * sunDistance,
                0.5,
                Math.cos(sunAngleUTC - lonBCN) * sunDistance
            );
        }
        updateEarthSolarLighting();
        setInterval(updateEarthSolarLighting, 60000);

        /* MOON RENDER */
        const moonContainer = document.getElementById('moon-canvas-container');
        const moonScene = new THREE.Scene();
        const moonCamera = new THREE.PerspectiveCamera(45, moonContainer.clientWidth / moonContainer.clientHeight, 0.1, 1000);
        const moonRenderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });

        moonRenderer.setSize(moonContainer.clientWidth, moonContainer.clientHeight);
        moonRenderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        moonContainer.appendChild(moonRenderer.domElement);

        const moonGeometry = new THREE.SphereGeometry(2, 64, 64);
        const moonMaterial = new THREE.MeshPhongMaterial({
            map: textureLoader.load(moonMapUrl),
            shininess: 0
        });

        const moonMesh = new THREE.Mesh(moonGeometry, moonMaterial);
        moonScene.add(moonMesh);

        moonCamera.position.z = 5.0;

        const moonSunLight = new THREE.DirectionalLight(0xffffff, 1.8);
        moonSunLight.position.set(6, 1, 7); 
        moonScene.add(moonSunLight);

        const moonAmbient = new THREE.AmbientLight(0x080812, 0.1);
        moonScene.add(moonAmbient);

        moonMesh.rotation.y = Math.PI * 0.45;
        moonMesh.rotation.x = 0.15;

        function animate() {
            requestAnimationFrame(animate);
            earthRenderer.render(earthScene, earthCamera);
            moonRenderer.render(moonScene, moonCamera);
        }
        animate();

        function handleResize() {
            const eW = earthContainer.clientWidth;
            const eH = earthContainer.clientHeight;
            if (eW && eH) {
                earthCamera.aspect = eW / eH;
                earthCamera.updateProjectionMatrix();
                earthRenderer.setSize(eW, eH);
            }

            const mW = moonContainer.clientWidth;
            const mH = moonContainer.clientHeight;
            if (mW && mH) {
                moonCamera.aspect = mW / mH;
                moonCamera.updateProjectionMatrix();
                moonRenderer.setSize(mW, mH);
            }
        }

        window.addEventListener('resize', handleResize);
        window.addEventListener('orientationchange', () => {
            setTimeout(handleResize, 200);
        });
    </script>
</body>
</html>
